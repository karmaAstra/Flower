<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower For Adu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <main class="page">
      <div class="flower-scene" aria-label="beautiful flower illustration">
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>

        <div class="flower">
          <div class="petal-ring" id="petalRing"></div>
          <div class="center-core"></div>
          <div class="sparkles" id="sparkles"></div>
        </div>
      </div>

      <div class="message-wrap">
        <p class="message">my bestiie Adu</p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
